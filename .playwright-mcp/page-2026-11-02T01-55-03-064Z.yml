              - generic: "{"
              - generic: "annotation { \"Name\" : \"Variable name\", \"Default\" : \"\", \"MaxLength\" : 10000, \"UIHint\" : [UIHint.VARIABLE_NAME, UIHint.SHOW_LABEL],"
              - generic: "\"Description\" : \"The name of a variable set earlier in this Part Studio, without the #.\" }"
              - generic: entry.exportName is string;
              - generic: "}"
              - generic: "}"
              - generic: "{"
              - generic: "// Merge into the registry: Variable + (Export for derive) and other producers add to it too."
              - generic: "var registry = getVariable(context, EXPORT_REGISTRY, {});"
              - generic: if (!(registry is map))
              - generic: "{"
              - generic: "registry = {};"
              - generic: "}"
              - generic: for (var i, entry in definition.exportEntries)
              - generic: "{"
              - generic: const parameterId = faultyArrayParameterId("exportEntries", i, "exportName");
              - generic: const name = entry.exportName;
              - generic: verifyVariableNameIsValid(name, parameterId);
              - generic: if (name == EXPORT_REGISTRY)
              - generic: "{"
              - generic: throw regenError("'" ~ name ~ "' is the registry itself and cannot be exported.", [parameterId]);
