              - generic: /** The registry variable the consumer ("Get variables from derive") looks for in the source Part Studio. */
              - generic: const EXPORT_REGISTRY = "exportVariables";
              - generic: /** Returned by getVariable for a name that is not set (no value of the model is this map). */
              - generic: "const NOT_SET = { \"notSet\" : \"add_variables_for_derive\" };"
              - generic: /**
              - generic: "* Add variables for derive."
              - generic: "*"
              - generic: "* Put this in the SOURCE Part Studio, after the variables it lists. It reads the current value of each named"
              - generic: "* variable and stores them together in one variable called `exportVariables` (a map of name -> value)."
              - generic: "* Extract variables, in the studio that derives from this one, reads that map from this studio's"
              - generic: "* context and sets every entry as an ordinary variable there."
              - generic: "*"
              - generic: "* It adds to the `exportVariables` map (Variable + with \"Export for derive\" does the same), and a name"
              - generic: "* listed twice is overwritten by the later one. Values are snapshots taken at the feature's position in"
              - generic: "* the tree. Query variables cannot be exported."
              - generic: "*/"
              - generic: "annotation { \"Feature Type Name\" : \"Add variables for derive\","
              - generic: "\"Feature Type Description\" : \"Lists the variables of this Part Studio that a Part Studio deriving from it can fetch with Get variables from derive.\","
