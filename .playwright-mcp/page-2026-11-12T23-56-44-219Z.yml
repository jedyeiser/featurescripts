                - generic: /**
                - generic: "* curveTrimCore - shared engine for the betterCurveTrim feature."
                - generic: "*"
                - generic: "* Trims and splits wire curves (single- or multi-edge) at arc-length locations. A"
                - generic: "* wire is read as one ordered path (constructPath); every cut location is a fraction"
                - generic: "* of the path length. Cuts are made exactly with opSplitEdges at arc-length"
                - generic: "* parameters (evEdge* / evDistance / opSplitEdges are all arc-length parameterized"
                - generic: "* by default), so no knot handling and no cutting planes - a plane would also cut the"
                - generic: "* curve anywhere else it crossed."
                - generic: "*"
                - generic: "* The exported helpers are grouped as:"
                - generic: "* - wire path : wirePath, pathTangentAtFraction, pathPointAtFraction"
                - generic: "* - locating cuts : projectToPath, fractionOfPoint, fractionNearestEntity,"
                - generic: "* fractionAtSignedDistance, evenDivisionFractions,"
                - generic: "* spacedFromPointFractions"
                - generic: "* - preview marks : markCutPoints, markProjectionToCurve, markPositiveDirection"
                - generic: "* - performing cuts : splitEdgesAtFractions (in place, one wire),"
                - generic: "* splitWireIntoPieces (separate wires), edgesBetweenCuts"
                - generic: "* - selecting result: keepPieceRange / keepOnePiece"
                - generic: "*/"
