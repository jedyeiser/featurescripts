                    - generic [ref=f12e103]:
                      - generic [ref=f12e104]:
                        - text: Over the last couple of weeks, I realized that I need better Control Flow for feature execution, so I have started to hack away at a while loop feature. Have control-flow type features already been implemented? And if so, where can I find it?I have started by incorporating 'while loop' type behavior into the std linear pattern. My goal is to be able to recreate geometry a number of times until some condition is satisfied (ultimately using FS eval as a means to optimize some geometry.) In this contrived example, I am deriving a star, and continue to derive a larger and larger star until the star's volume would falsify a while loop guard. I got that working fine. But since each time I have to delete the previous star attempt, at the end I'm left with the star that just so happens to be the last one before the while loop exited. Is there any way to assign this star the same id as the first one created such that subsequent features 'recognize' it? How would I do that?
                        - link "https://cad.onshape.com/documents/9b79414e1e0f4657737c60a1/w/7a7ca4a3e5bbfe2a831c16b5/e/d1a090a875d0434a34c6cebb" [ref=f12e105] [cursor=pointer]:
