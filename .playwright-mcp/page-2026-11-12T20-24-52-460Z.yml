            - generic: /**
            - generic: "* Referenced part (2026-09-28): a part from reference surfaces, every offset and side read from ONE"
            - generic: "* reference point -- the chains done by hand before as Offset+ x N, Mutual Trim+, Enclose+ / Thicken+,"
            - generic: "* Split+ and a mirror."
            - generic: "*"
            - generic: "* The REFERENCE POINT sets every direction: each offset and the thickness are signed, positive"
            - generic: "* toward the point and negative away from it (0 = the surface as it is). It must not lie on a"
            - generic: "* surface it measures."
            - generic: "*"
            - generic: "* THICKENED (base, mats, glass, top sheet): the profile is offset, thickened, then cut by the"
            - generic: "* offset periphery (the part keeps the point's side of it) and by the caps. Thickening"
            - generic: "* BEFORE the periphery cut keeps the side walls on the periphery instead of tilted"
            - generic: "* along the profile's normals. The point lies inside the periphery and on the side the"
            - generic: "* profile is thickened toward (a negative thickness goes the other way)."
            - generic: "* CONSTRAINED (cores): top, bottom and periphery are offset and enclosed together with the caps"
            - generic: "* (and the mirror plane); the solid holding the point is kept and cut by the caps, so the"
            - generic: "* caps always trim -- std Enclose drops the walls between touching pockets, so caps that"
            - generic: "* only divide a closed volume would otherwise do nothing. The point lies inside the part."
            - generic: "*"
            - generic: "* Caps (optional, both modes): surfaces or faces (offset with Offset+), or construction planes and"
            - generic: "* mate connectors (infinite planes, moved by the offset). The part keeps the point's side of each."
            - generic: "*"
            - generic: "* Mirror plane (optional): the surfaces are one half. The half is cut at the plane (the side the"
            - generic: "* surfaces are on is kept -- a point ON the plane is fine), mirrored and united. With a profile offset the"
            - generic: "* thickened layer is built from the unoffset profile (see thickenLayer) so its faces meet the plane exactly."
            - generic: "*"
            - generic: "* The inputs are never changed: every offset is a new surface (0 = a copy), deleted at the end."
            - generic: "*"
            - generic: "* Publishes (Extract variables), every key always present (empty when not applicable): output (the"
            - generic: "* part), profileFaces, oppositeFaces (Thickened: on the offset profile, and the thickness away from"
            - generic: "* it), topFaces, bottomFaces (Constrained), sideFaces (on the offset periphery), cap1Faces, cap2Faces."
            - generic: "* Faces are sorted by where they lie (mirrored faces by their mirror image), so they survive the"
            - generic: "* splits and the union."
            - generic: "*/"
            - generic: /** How the part is made. */
            - generic: export enum ReferencedPartType
            - generic: "{"
