                      - generic [ref=f13e101]:
                        - text: Suppose I have a set of holes and features, removing material in a part, up-to-next-surface.Suppose this set is a standard feature for mating some assembly that will be used in many designs across many projects. And they need to be standardized.Suppose I want one master version of this set to be managed by one engineer, and for all other engineers to just be able to use it. With versioning working.Suppose I would like the aforementioned 'other engineers' to be able to place sketch point on their part, and be able to import/copy/reuse/derive everything from the master.How can this be done?- Onshape doesn't let multiple users cut and paste sketches easily. And even if it did, it would be a klunky and error prone way to do this.- What I'm describing isn't really a part, since it's actually a set of multiple instructions for making various holes of various shapes and sizes. So importing or making a derived part doesn't do the job.- I could make a "negative" of the set of holes and features, lets other engineers use derive and then a boolean. But that is klunky in a few ways, including loss of up-to-next, and inability to drop the set of features in specific locations at will.Being able to take a set of *instructions* referencing the origin in *one* project, and then being able to apply those instructions, in *another* project, relative to a *point* in that project really seems like something Onshape could do. And it would really leverage the group collaboration nature of the product.I have not explored Feature Script. Is that the way to do this? Or, more likely, what feature am I missing that accomplishes something like the above?I've attached a link to a simple example of the above. Contrived, for simplicity, from some parts used on a kids robot ream I coach.I'd like multiple users to be able to re-use the features in the Xpattern, any place, in any design.
