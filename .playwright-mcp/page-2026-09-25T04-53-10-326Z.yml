                            - generic [ref=f13e145]: I ran into the same thing trying to use a "skeleton sketch" downstream. The built in Derive does not allow you to locate it at all. I'd suggest making a help request to allow positioning of derived features. You are a paid user and Onshape tallies requests from paid users highest.In the meantime, there is a featruescript that allows placement to a mate connector. It is called "SuperDerive". Look it up it might be what you are after. I used it on my project. It allows placing in the target document by a mate connector. But I think from the source document it limits its positioning point to the origin of the source document. So make your sketch on the origin.
