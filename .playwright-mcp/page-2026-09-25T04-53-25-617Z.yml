                            - link "@jelte_steur_info" [ref=f16e1515] [cursor=pointer]:
                              - /url: https://forum.onshape.com/profile/jelte_steur_info
                            - text: ", I need to find a better way to extract the default icons and modify them because my last attempt at scraping the site gave me 15000 icons unsorted and unnamed. Point of order for future QV+ enhancements, I have an implementation of a Visible Faces From Direction \"query\" that's actually just a geometry operation that returns queries after it runs. The way that geometry operation works, it would actually modify the input objects and create new split line geometry and edges in some cases where occlusion happens, so it's not a pure query function. Probably in the cases you'd reach for a query like this you'd be making the same modifications that the operation returns so I could convince myself that violating the purity of a query only function has justifiable utility but I don't want to muddy the waters with unexpected behavior when every other query in the feature does no modification to the input. Should this be included in QV+ or should I start a separate operator Query Variable feature that has utility but potentially modifies your input geometry?"
