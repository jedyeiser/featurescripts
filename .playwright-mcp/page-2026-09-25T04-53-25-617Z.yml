                          - generic "Edited Tue Oct 28 07:40:43 2025 by Derek_Van_Allen_BD." [ref=f16e103]: edited October 2025
                    - generic [ref=f16e105]:
                      - generic [ref=f16e106]:
                        - paragraph [ref=f16e107]:
                          - link [ref=f16e108] [cursor=pointer]:
                            - /url: https://cad.onshape.com/documents/128231ad02069b995b5dfc8d/w/40c217484879fb976782600a/e/c5254f4fcd1b28319819ce30
                            - strong [ref=f16e109]: "-Link to feature up front-"
                          - text: "Query Variable has been a game changer for more programmatic workflows that save me from needing to develop custom scripts when I can instead pass other existing features through a QV and get results that way. That being said, there are some more powerful querying techniques which haven't yet been added to the default Query Variable implementation that I'm taking some time to write into an extended toolset. For example: just about everything in"
                          - link "the old Query Explorer feature" [ref=f16e110] [cursor=pointer]:
                            - /url: https://forum.onshape.com/discussion/14777/query-explorer-feature
                          - text: "could be used as a QV to enable more parametric workflows involving spatial, geometric, or directional filtering of your queries. My long term goal is to implement all of these Query Explorer features into the new Query Variable feature but I'm starting out small with a few easier lift features and will add more over time. The first two features in my Query Variable+ implementation are the following:"
                          - link [ref=f16e111] [cursor=pointer]:
                            - /url: https://cad.onshape.com/documents/128231ad02069b995b5dfc8d/w/40c217484879fb976782600a/e/4702022d8b6f26ca6f1d2558
                            - strong [ref=f16e112]: Tangent(ish) Faces
                        - paragraph [ref=f16e113]: This one is simple, the qTangentConnectedFaces() function in the standard library already has an overload which allows you to specify an angle tolerance for some flexibility in the definition of the word "tangent" so I just replaced the version in Query Variable with this angular tolerance version. This lets me flood select face groups from cursed not-mesh import geometry and use the selections to create patch faces and create new clean parametric surfaces without having a feature tree to work with.
                        - link [ref=f16e116] [cursor=pointer]:
                          - /url: https://us.v-cdn.net/5022071/uploads/GG3YWCEBPSIG/image.png
                          - img "image.png" [ref=f16e117]
                        - paragraph [ref=f16e118]: This is not a mesh.
                        - link [ref=f16e121] [cursor=pointer]:
                          - /url: https://us.v-cdn.net/5022071/uploads/1TF5V4GAZ9RJ/image.png
                          - img "image.png" [ref=f16e122]
                        - paragraph [ref=f16e123]:
                          - text: But with a little bit of curve approximation and resurfacing later it can become usable geometry again. Selecting groups of nearly tangent faces made this much easier to execute.
                          - link [ref=f16e124] [cursor=pointer]:
                            - /url: https://cad.onshape.com/documents/128231ad02069b995b5dfc8d/w/40c217484879fb976782600a/e/9834053f593e30426e79ab58
                            - strong [ref=f16e125]: Matching Bodies
                          - text: Query Variable comes with the ability to select matching edges or matching faces, why not matching bodies? Well the qMatching feature doesn't allow this selection type so that's why it's not allowed here, but there's a similar function called clusterBodies that does something close to this for cut list purposes. I leveraged this into a qMatchingBodies function that allows you to select a part and the function will return all parts in the studio that clusterBodies identifies as a geometric match for the input. (With some tolerance)
                        - link [ref=f16e128] [cursor=pointer]:
                          - /url: https://us.v-cdn.net/5022071/uploads/VQYN8WYUMSHY/image.png
                          - img "image.png" [ref=f16e129]
                        - paragraph [ref=f16e130]:
                          - text: Useful for workflows where you're working with repetitive geometry that's not necessarily the result of a pattern, or if you've willfully ignored the "best practices" instructions of assembly modeling workflows and need to check that your parts actually are still copies of each other at the end of the tree.
                          - strong [ref=f16e131]: "Other features I'd like to implement into the list from Query Explorer:"
                          - text: "- Geometry filters for face types - Distance filters - Direction filters - Attribute filters for sheet metal and frames - Cap entity filters - …And more things I'm sure will be useful to someone at some point that I have yet to discover"
