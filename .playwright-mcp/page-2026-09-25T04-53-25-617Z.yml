                          - paragraph [ref=f16e327]: There isn't, as far as I know. That tab is an extrude with an 89 degree draft, a query variable to grab all the edges of that operation and another one to subtract all edges adjacent to the first input face, and a projection of the remainder onto the input face. It's one of a few methods of medial axis approach and is somehow way more performant than the delaunay method I was working on before. Could use some size comparison threshold filtering though, which will be one of the things I add to QV+. Could turn into its own script when the concept is proven, and actually a lot of use cases for QV+ could be turned into dedicated scripts based on concept studios like this one.
