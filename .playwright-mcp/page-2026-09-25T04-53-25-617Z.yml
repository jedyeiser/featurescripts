                          - generic [ref=f16e990]:
                            - paragraph [ref=f16e991]:
                              - text: Yeah yeah okay fine, that update was mid and I could do better. Here's 10 more query options for you all under the
                              - strong [ref=f16e992]: Positional / Directional
                              - text: "query umbrella:"
                            - list [ref=f16e993]:
                              - listitem [ref=f16e994]:
                                - strong [ref=f16e995]: Plane Normal
                                - text: ": Takes a reference plane face ("
                                - code [ref=f16e996]: positionalPlane
                                - text: ) and filters the input entities (
                                - code [ref=f16e997]: positionalEntities
                                - text: ) to those with normals parallel to that plane via
                                - code [ref=f16e998]: qParallelPlanes
                                - text: ; returns a Query of the matching entities.
                              - listitem [ref=f16e999]:
                                - strong [ref=f16e1000]: Intersects Line
                                - text: ": Uses a selected linear edge ("
                                - code [ref=f16e1001]: positionalLine
                                - text: ) to keep entities intersecting that line through
                                - code [ref=f16e1002]: qIntersectsLine
                                - text: ; outputs a Query of the intersecting entities.
                              - listitem [ref=f16e1003]:
                                - strong [ref=f16e1004]: Intersects Plane
                                - text: ": Requires a planar face reference and applies"
                                - code [ref=f16e1005]: qIntersectsPlane
                                - text: to find entities crossing that plane; returns a Query of intersecting entities.
                              - listitem [ref=f16e1006]:
                                - strong [ref=f16e1007]: Intersects Ball
                                - text: ": Uses a reference vertex plus a radius to select entities within that sphere via"
                                - code [ref=f16e1008]: qWithinRadius
                                - text: ; emits a Query of entities inside or touching the ball.
                              - listitem [ref=f16e1009]:
                                - strong [ref=f16e1010]: Contains Point
                                - text: ": With a reference vertex, applies"
                                - code [ref=f16e1011]: qContainsPoint
                                - text: to find entities that include the point; outputs a Query of containing entities.
                              - listitem [ref=f16e1012]:
                                - strong [ref=f16e1013]: Closest To
                                - text: ": Given a reference vertex, uses"
                                - code [ref=f16e1014]: qClosestTo
                                - text: to pick the nearest entities to that point; returns a Query of the closest hits.
                              - listitem [ref=f16e1015]:
                                - strong [ref=f16e1016]: Farthest Along Direction
                                - text: ": Accepts a direction reference (edge or direction-capable selection) and uses"
                                - code [ref=f16e1017]: qFarthestAlong
                                - text: to keep entities farthest in that direction; results in a Query of those entities.
                              - listitem [ref=f16e1018]:
                                - strong [ref=f16e1019]: Coincides With Plane
                                - text: ": Selects a reference plane and returns entities that lie on it via"
                                - code [ref=f16e1020]: qCoincidesWithPlane
                                - text: ; output is a Query of coincident entities.
                              - listitem [ref=f16e1021]:
                                - strong [ref=f16e1022]: Plane Parallel To Direction
                                - text: ": Uses a direction reference and"
                                - code [ref=f16e1023]: qPlanesParallelToDirection
                                - text: to keep planar entities whose normals align with that direction; produces a Query.
                              - listitem [ref=f16e1024]:
                                - strong [ref=f16e1025]: Face Parallel To Direction
                                - text: ": Also direction-based; applies"
                                - code [ref=f16e1026]: qFacesParallelToDirection
                                - text: to retain faces parallel to the given direction, returning a Query of those faces
