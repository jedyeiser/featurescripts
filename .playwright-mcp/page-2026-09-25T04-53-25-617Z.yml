                              - /url: https://forum.onshape.com/profile/Derek_Van_Allen_BD
                            - text: Most of my functionality requirements are around smart fillet selections. I had been using Evan's Selection Fillet FS before query variable arrived. My workflow is usually for making parts machinable, so it's a lot of convexity + parallel + above/below a plane. This lets me select all edges per machining setup (bottom, side, top) and make changes quickly. My other large use case is for selecting all faces that lie on the same plane. Would love sheet metal functionality because I use it for designing flex PCBs. Was considering a standalone FS that handled Sheet Metal → Flex PCB, but haven't set the time to create that just yet.
