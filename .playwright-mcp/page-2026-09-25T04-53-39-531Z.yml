                          - generic [ref=f17e191]: "});"
                          - generic [ref=f17e193]: // 4. Transform the newly created body into its correct rotational position.
                          - generic [ref=f17e194]: const currentAngle = i * angleStep;
                          - generic [ref=f17e196]:
                            - text: const bodyToTransform = qCreatedBy(localId +
