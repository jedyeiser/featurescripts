                            - text: );
                          - generic [ref=f17e115]:
                            - text: "annotation {"
                            - generic [ref=f17e116]: "\"Feature Type Name\""
                            - text: ":"
                            - generic [ref=f17e117]: "\"Indexed Parametric Circular Pattern\""
                            - text: ","
                            - generic [ref=f17e118]: "\"Creates a circular pattern of extrusions from a sketch, while adjusting an index variable within the sketch\""
                            - text: ":"
                            - generic [ref=f17e119]: "\"\""
                            - text: "}"
                          - generic [ref=f17e120]: export const parametricCircularPattern = defineFeature(function(context is Context, id is Id, definition is map)
                          - generic [ref=f17e121]: precondition
                          - generic [ref=f17e122]: "{"
                          - generic [ref=f17e123]: // Define the parameters of the feature type
                          - generic [ref=f17e124]:
