                            - text: ":"
                            - generic [ref=f17e145]: "\"Total Angle for Pattern\""
                            - text: "}"
                          - generic [ref=f17e146]: isAngle(definition.totalAngle, ANGLE_360_BOUNDS);
                          - generic [ref=f17e148]:
