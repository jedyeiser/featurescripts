                            - text: ":"
                            - generic [ref=f17e150]: "\"Face Extrusion Depth per Instance\""
                            - text: "}"
                          - generic [ref=f17e151]: isLength(definition.depth, LENGTH_BOUNDS);
                          - generic [ref=f17e153]: "}"
                          - generic [ref=f17e154]: //Action Block
