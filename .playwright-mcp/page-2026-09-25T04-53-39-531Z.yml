                        - generic [ref=f17e253]:
                          - paragraph [ref=f17e255]: If I understand correctly, the sketch feature exists in the same feature tree as your custom feature, and it reads the index variable to determine the shape. The issue is that features later in a feature tree can't update past features. Once the sketch has been resolved, setting the variable index later on does not effect the already resolved sketch. Think of the feature tree like time travel - future events do not effect past events. I think to achieve what you are looking for, your source shape sketch will need to be in a configured part studio (with index as a configuration parameter), and then you will have to instantiate (https://cad.onshape.com/FsDoc/library.html#module-instantiator.fs) the configured sketch into your destination part studio.
                          - generic [ref=f17e256]:
                            - link "www.smartbenchsoftware.com" [ref=f17e257] [cursor=pointer]:
