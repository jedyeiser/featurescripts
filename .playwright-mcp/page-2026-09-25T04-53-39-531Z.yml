                      - generic [ref=f17e103]:
                        - paragraph [ref=f17e104]: Hello, I've been fighting with how to do this for some time, I know in the time I've spent I could have just hand modelled the solution, but I keep thinking there MUST be a way to do this…
                        - paragraph [ref=f17e105]: I have a reasonably complex profile, in a sketch (artistic, hand drawn). Aspects of the profile (some lengths, and offsets via constraints) are driven by an external "index" value, so index 1 results in one shape, index 2 another shape, and so forth. The total number of objects is also a variable (in a variable studio). Currently it's 36, but it could be anywhere from 20 to 100 or more…
                        - paragraph [ref=f17e106]: I have a script together that creates a customized circular pattern, which uses the sketch, and a center axis, to extrude the profile to a thickness, then move around, extruding separate parts, while doing a setVariable() inside the for loop… Unfortunately while this works in that it creates 38 copies of the profile extruded in a circle, it does not work in that they are alll identical, they don't honor/reference the updated "index" value.
                        - paragraph [ref=f17e107]: Is there a way to do this that I'm missing?
                        - paragraph [ref=f17e108]: "Here is the feature script so far:"
                        - generic [ref=f17e109]:
                          - generic [ref=f17e110]: FeatureScript 2770;
