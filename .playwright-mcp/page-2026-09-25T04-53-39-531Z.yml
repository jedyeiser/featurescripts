                          - generic [ref=f17e129]: definition.faceToPattern is Query;
                          - generic [ref=f17e131]:
                            - text: "annotation {"
                            - generic [ref=f17e132]: "\"Name\""
                            - text: ":"
                            - generic [ref=f17e133]: "\"Axis of Pattern\""
                            - text: ","
                            - generic [ref=f17e134]: "\"Filter\""
                            - text: ": EntityType.EDGE,"
                            - generic [ref=f17e135]: "\"MaxNumberOfPicks\""
