          - generic [ref=f15e509]:
            - generic:
              - generic: FeatureScript 3083;
              - generic: "import(path : \"onshape/std/common.fs\", version : \"3083.0\");"
              - generic: "// IMPORT: extract_variables_utils.fs (re-exports extract_outputs.fs)"
              - generic: "export import(path : \"a4dcd70ce9ceec588536fb0c\", version : \"16969bd79ed1ef79531eb7e0\");"
              - generic: "// IMPORT: extract_variables_icon.svg (feature icon)"
              - generic: "IconNamespace::import(path : \"1fec12e049522ab98f8177ff\", version : \"9c7ddae6a84d0131481b57c4\");"
              - generic: /**
              - generic: "* Extract variables."
              - generic: "*"
              - generic: "* One per block of the tree. Takes the block's features as sources and publishes what later"
              - generic: "* features need -- ordinary variables (`#name`) and query variables (pickable in any native"
              - generic: "* dialog) -- so the block's hand-made Query Variable features can go."
              - generic: "*"
              - generic: "* Sources need not be producers: every source offers the standard keys output /"
              - generic: "* outputFaces / outputEdges / outputVertices (embedded by a producer, else what the feature"
              - generic: "* created), and modifiedFaces / modifiedEdges / modifiedVertices (what it created or last"
              - generic: "* modified -- the only way to reach what an in-place feature like Move boundary changed)."
              - generic: "* Producers add their own keys. \"Add keys from sources\" lists them all."
              - generic: "*"
              - generic: "* Entry types: a source key as is; filtered (entity type, body type, name, largest N);"
              - generic: "* closest to a point; edges shared by two sources; a chain end; the edges of a chain"
              - generic: "* between two points; bridging curve input (the end edge and its vertex); a region (the faces"
              - generic: "* around a point, flood-filled up to boundary edges, or that region's boundary). Composed entries"
              - generic: "* hold the entities present now (std robust freeze); a source key may re-evaluate on use."
              - generic: "* \"Track\" adds a tracking query to the freeze, so the variable follows its entities through"
              - generic: "* later splits and in-place edits."
              - generic: "*"
              - generic: "* Names: `<prefix>_<name>`, the name defaulting to the key (\"output@2\" -> \"output_2\")."
              - generic: "* Notices: one per regeneration; a warning only when an entry could not be published."
              - generic: "*/"
              - generic: "annotation { \"Icon\" : IconNamespace::BLOB_DATA,"
              - generic: "\"Feature Type Name\" : \"Extract variables\","
              - generic: "\"Feature Type Description\" : \"Publish variables and query variables from a block of features: their standard outputs, embedded keys, or composed selections.\","
              - generic: "\"UIHint\" : UIHint.NO_PREVIEW_PROVIDED,"
              - generic: "\"Editing Logic Function\" : \"extractVariablesEditLogic\""
              - generic: "}"
              - generic: export const extractVariables = defineFeature(function(context is Context, id is Id, definition is map)
              - generic: precondition
              - generic: "{"
              - generic: "annotation { \"Name\" : \"Sources\", \"Description\" : \"The features of this block. Any feature works; producers add their own keys.\" }"
              - generic: definition.sources is FeatureList;
              - generic: "annotation { \"Name\" : \"Prefix\", \"Default\" : \"\", \"MaxLength\" : 256, \"Description\" : \"Put in front of every published name, joined with an underscore. Empty = none.\" }"
              - generic: definition.prefix is string;
              - generic:
                - generic: "annotation { \"Name\" : \"Add keys from sources\", \"Description\" : \"Add a Source key entry for every key the sources offer that is not listed yet (faces, vertices and inputs excepted)."
                - generic: "Existing entries are kept.\" }"
              - generic: isButton(definition.addKeys);
              - generic: "annotation { \"Name\" : \"Entries\", \"Item name\" : \"entry\", \"Item label template\" : \"#x_name #x_sourceKey\" }"
              - generic: definition.extractEntries is array;
              - generic: for (var entry in definition.extractEntries)
            - generic [ref=f15e510]:
              - generic [ref=f15e511]: extract_variables_utils
              - generic [ref=f15e513]: extract_variables_icon.svg
