            - generic: FeatureScript 3083;
            - generic: "import(path : \"onshape/std/common.fs\", version : \"3083.0\");"
            - generic: "// IMPORT: body_identity_icon.svg (feature icon)"
            - generic: "IconNamespace::import(path : \"eca6701c4f4c36eb73d9da99\", version : \"014c5808edfc70e2e2632275\");"
            - generic: /**
            - generic: "* Body identity: gives bodies a stable identity (opNameEntity), so features, mates, sketch planes, derives and released"
            - generic: "* part numbers that refer to a body by qNamed(identity) keep resolving when the body is replaced -- the import update of a"
            - generic: "* body the deform backend swaps in, whose id changes. It changes no geometry. Brief: docs/briefs/body_identity_feature.md."
            - generic: "*"
            - generic: "* HOW THE BODIES ARE FOUND (differs from the brief): a feature cannot read a body's NAME while it regenerates (getProperty"
            - generic: "* throws \"Cannot get properties during feature regeneration\", correction 36), so the feature cannot search by name. Each item"
            - generic: "* therefore holds a SELECTION (the body, set through REST as a deterministic id) and the IDENTITY string. The backend, which"
            - generic: "* can read names through REST, re-points the selection after an import update; the identity string never changes, so"
            - generic: "* everything downstream keeps resolving. In the dialog the identity defaults to the picked body's name (the editing logic can"
            - generic: "* read it)."
            - generic: "*"
            - generic: "* The per-item operation id comes from the IDENTITY (sanitised plus a checksum), never from list order or the feature id, so"
            - generic: "* a list that gains or loses items, or a feature re-created by REST, names the same bodies the same way."
            - generic: "*"
            - generic: "* A body that is missing or listed twice, or an identity that is empty or already used, is a feature WARNING that names it;"
            - generic: "* the other items are still named. The parameter list is frozen once published (correction 64): anything new goes into"
            - generic: "* extraOptions (hidden text)."
            - generic: "*/"
            - generic: /** Characters used to checksum an identity (anything else counts as 0). */
            - generic: "const CHECKSUM_ALPHABET = \" !#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijklmnopqrstuvwxyz{|}~\";"
            - generic: "annotation { \"Icon\" : IconNamespace::BLOB_DATA, \"Feature Type Name\" : \"Body identity\","
            - generic: "\"Feature Type Description\" : \"Names bodies so downstream features, mates and part numbers keep resolving when the bodies are replaced. Changes no geometry.\","
            - generic: "\"Editing Logic Function\" : \"bodyIdentityEditLogic\" }"
            - generic: export const bodyIdentity = defineFeature(function(context is Context, id is Id, definition is map)
            - generic: precondition
            - generic: "{"
            - generic: "annotation { \"Name\" : \"Bodies\", \"Item name\" : \"body\", \"Item label template\" : \"#identity\","
            - generic: "\"Description\" : \"Each item: a body and the identity it carries. Add items through the API or by picking.\" }"
            - generic: definition.bodies is array;
            - generic: for (var item in definition.bodies)
            - generic: "{"
            - generic: "annotation { \"Name\" : \"Body\", \"Filter\" : EntityType.BODY && (BodyType.SOLID || BodyType.SHEET || BodyType.WIRE), \"MaxNumberOfPicks\" : 1,"
            - generic: "\"Description\" : \"The body to name. Re-point it after the body is replaced; the identity stays.\" }"
            - generic: item.body is Query;
            - generic: "annotation { \"Name\" : \"Identity\", \"Default\" : \"\", \"MaxLength\" : 256,"
            - generic: "\"Description\" : \"The stable name (qNamed). Empty: the picked body's name. Unique in the Part Studio. Do not change it once downstream features use it.\" }"
            - generic: item.identity is string;
            - generic: "}"
            - generic: "// Room for options added after the first version: the parameter list cannot be extended safely once published"
            - generic: // (correction 64).
            - generic: "annotation { \"Name\" : \"Extra options\", \"Default\" : \"\", \"MaxLength\" : 4096, \"UIHint\" : [UIHint.ALWAYS_HIDDEN] }"
            - generic: definition.extraOptions is string;
            - generic: "}"
            - generic: "{"
