<text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#333333" font-weight="bold">5. The fix for arcs: a tangent-constrained BIARC</text>
<text x="20.0" y="48.0" font-size="12" text-anchor="start" fill="#888888" font-weight="normal">Given two end points and their TRUE tangents, one arc can match only one tangent. Two arcs can match both.</text>
