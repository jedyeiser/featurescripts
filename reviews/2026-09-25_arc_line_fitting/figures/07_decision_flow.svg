<text x="560.0" y="541.0" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal">emit arcs (G1)</text>
<line x1="475.0" y1="475.0" x2="420.0" y2="475.0" stroke="#333333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="448.0" y="468.0" font-size="11" text-anchor="middle" fill="#333333" font-weight="normal">no</text>
<rect x="260.0" y="462.0" width="160.0" height="56.0" rx="6" fill="#FEF5E7" stroke="#D68910" stroke-width="1.5"/>
<text x="340.0" y="479.0" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal">split at worst point,</text>
<text x="340.0" y="494.0" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal">biarc each half</text>
<text x="340.0" y="509.0" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal">(until cap -> spline)</text>
