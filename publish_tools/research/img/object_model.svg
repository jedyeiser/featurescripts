<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Onshape object model: where properties/categories live and who can write them</text>
  <text x="20" y="50" fill="#555">Verified on K2 via GET /api/v6/metadata (2026-09-28) + FS eval API on test doc 73271cfc</text>

  <!-- legend -->
  <g transform="translate(640,70)">
    <rect x="0" y="0" width="300" height="112" rx="6" fill="#f7f7f7" stroke="#bbb"/>
    <text x="10" y="18" font-weight="bold">Writers</text>
    <rect x="10" y="28" width="46" height="16" rx="3" fill="#1651B0"/><text x="16" y="40" fill="#fff" font-size="11">FS</text>
    <text x="64" y="40">FeatureScript setProperty (feature body)</text>
    <rect x="10" y="50" width="46" height="16" rx="3" fill="#2e8b57"/><text x="16" y="62" fill="#fff" font-size="11">REST</text>
    <text x="64" y="62">POST /api/metadata/... (app / script)</text>
    <rect x="10" y="72" width="46" height="16" rx="3" fill="#777"/><text x="16" y="84" fill="#fff" font-size="11">UI</text>
    <text x="64" y="84">Properties dialog</text>
    <rect x="10" y="92" width="46" height="16" rx="3" fill="#b8860b"/><text x="16" y="104" fill="#fff" font-size="11">CMP</text>
    <text x="64" y="104">computed property (FS fn, Part/Asm)</text>
  </g>

  <!-- Company -->
  <rect x="20" y="70" width="600" height="60" rx="8" fill="#eef3fb" stroke="#1651B0"/>
  <text x="32" y="92" font-weight="bold">Company (K2 Enterprise) -- admin settings</text>
  <text x="32" y="112" fill="#333">Custom property DEFINITIONS + CATEGORIES (scope = object type). Admin UI only (no FS).</text>

  <!-- Document -->
  <rect x="20" y="150" width="600" height="60" rx="8" fill="#fafafa" stroke="#444"/>
  <text x="32" y="172" font-weight="bold">Document / Workspace</text>
  <text x="32" y="192">Name, Description, Category (+ custom props scoped to Document)</text>
  <rect x="470" y="160" width="40" height="16" rx="3" fill="#2e8b57"/><text x="474" y="172" fill="#fff" font-size="11">REST</text>
  <rect x="515" y="160" width="30" height="16" rx="3" fill="#777"/><text x="521" y="172" fill="#fff" font-size="11">UI</text>
  <text x="470" y="200" fill="#c00" font-size="12">FS: no access</text>

  <!-- Elements -->
  <rect x="20" y="230" width="190" height="130" rx="8" fill="#fafafa" stroke="#444"/>
  <text x="32" y="252" font-weight="bold">Part Studio element</text>
  <text x="32" y="272" font-size="12">Name, Category,</text>
  <text x="32" y="288" font-size="12">Description, Title 1-3</text>
  <text x="32" y="304" font-size="12">(+ custom, scope Part Studio)</text>
  <rect x="32" y="314" width="40" height="16" rx="3" fill="#2e8b57"/><text x="36" y="326" fill="#fff" font-size="11">REST</text>
  <rect x="77" y="314" width="30" height="16" rx="3" fill="#777"/><text x="83" y="326" fill="#fff" font-size="11">UI</text>
  <text x="32" y="350" fill="#c00" font-size="12">FS: cannot write/read</text>

  <rect x="225" y="230" width="190" height="130" rx="8" fill="#fafafa" stroke="#444"/>
  <text x="237" y="252" font-weight="bold">Drawing element</text>
  <text x="237" y="272" font-size="12">Name, Part no., Revision,</text>
  <text x="237" y="288" font-size="12">Category, Drawn by, ...</text>
  <text x="237" y="304" font-size="12">(+ custom, scope Drawing)</text>
  <rect x="237" y="314" width="40" height="16" rx="3" fill="#2e8b57"/><text x="241" y="326" fill="#fff" font-size="11">REST</text>
  <rect x="282" y="314" width="30" height="16" rx="3" fill="#777"/><text x="288" y="326" fill="#fff" font-size="11">UI</text>
  <text x="237" y="350" fill="#c00" font-size="12">FS: no access</text>

  <rect x="430" y="230" width="190" height="130" rx="8" fill="#fafafa" stroke="#444"/>
  <text x="442" y="252" font-weight="bold">Variable Studio / App tab</text>
  <text x="442" y="272" font-size="12">Name, Part no., Category...</text>
  <text x="442" y="288" font-size="12">App tab = the only real</text>
  <text x="442" y="304" font-size="12">"custom element type"</text>
  <rect x="442" y="314" width="40" height="16" rx="3" fill="#2e8b57"/><text x="446" y="326" fill="#fff" font-size="11">REST</text>
  <rect x="487" y="314" width="30" height="16" rx="3" fill="#777"/><text x="493" y="326" fill="#fff" font-size="11">UI</text>

  <!-- Inside part studio context -->
  <rect x="20" y="380" width="600" height="200" rx="8" fill="#eef3fb" stroke="#1651B0"/>
  <text x="32" y="402" font-weight="bold">Inside the Part Studio context (regenerated by features)</text>

  <rect x="32" y="414" width="280" height="80" rx="6" fill="#fff" stroke="#888"/>
  <text x="42" y="434" font-weight="bold">Parts / composites (solid, sheet)</text>
  <text x="42" y="452" font-size="12">Name, Part no., Description, Title 1-3,</text>
  <text x="42" y="468" font-size="12">Material, CUSTOM(id), ... -> BOM, drawings</text>
  <rect x="42" y="474" width="30" height="16" rx="3" fill="#1651B0"/><text x="48" y="486" fill="#fff" font-size="11">FS</text>
  <rect x="77" y="474" width="40" height="16" rx="3" fill="#2e8b57"/><text x="81" y="486" fill="#fff" font-size="11">REST</text>
  <rect x="122" y="474" width="30" height="16" rx="3" fill="#777"/><text x="128" y="486" fill="#fff" font-size="11">UI</text>
  <rect x="157" y="474" width="40" height="16" rx="3" fill="#b8860b"/><text x="162" y="486" fill="#fff" font-size="11">CMP</text>
  <text x="205" y="486" font-size="11" fill="#c00">UI edit wins</text>

  <rect x="324" y="414" width="284" height="80" rx="6" fill="#fff" stroke="#888"/>
  <text x="334" y="434" font-weight="bold">Wire / sketch / MC bodies</text>
  <text x="334" y="452" font-size="12">setProperty accepted in eval (NAME undefined</text>
  <text x="334" y="468" font-size="12">for wires); not BOM items</text>
  <rect x="334" y="474" width="30" height="16" rx="3" fill="#1651B0"/><text x="340" y="486" fill="#fff" font-size="11">FS</text>

  <rect x="32" y="504" width="576" height="64" rx="6" fill="#fff" stroke="#888"/>
  <text x="42" y="524" font-weight="bold">Studio-level data that FS CAN write (not "properties")</text>
  <text x="42" y="542" font-size="12">setVariable (variables panel; read by getVariable, derive, computed props) | attributes on qOrigin</text>
  <text x="42" y="558" font-size="12">| custom FS tables (Part Studio panel + drawing "Custom table") | feature-embedded maps</text>

  <!-- reading notes -->
  <g transform="translate(640,200)">
    <rect x="0" y="0" width="300" height="380" rx="6" fill="#fff8e6" stroke="#b8860b"/>
    <text x="10" y="20" font-weight="bold">Who can READ a property</text>
    <text x="10" y="44" font-size="12">Feature body (regen): getProperty</text>
    <text x="10" y="60" font-size="12">  on current context THROWS (std doc).</text>
    <text x="10" y="84" font-size="12">Editing logic / table fn / eval API:</text>
    <text x="10" y="100" font-size="12">  getProperty works on bodies.</text>
    <text x="10" y="124" font-size="12">Computed property fn: reads geometry,</text>
    <text x="10" y="140" font-size="12">  attributes, non-computed props and</text>
    <text x="10" y="156" font-size="12">  Part Studio VARIABLES.</text>
    <text x="10" y="180" font-size="12">REST GET /metadata: everything,</text>
    <text x="10" y="196" font-size="12">  document -> element -> part.</text>
    <text x="10" y="220" font-size="12">Drawing notes/title block: drawing</text>
    <text x="10" y="236" font-size="12">  props + ONE sheet reference's props.</text>
    <text x="10" y="266" font-weight="bold" font-size="12">Nobody in FS can see element-</text>
    <text x="10" y="282" font-weight="bold" font-size="12">or document-level properties.</text>
    <text x="10" y="312" font-size="12">Categories: object's "type" label.</text>
    <text x="10" y="328" font-size="12">  Settable via UI/REST, NOT via FS</text>
    <text x="10" y="344" font-size="12">  (PropertyType has no CATEGORY).</text>
  </g>
</svg>
